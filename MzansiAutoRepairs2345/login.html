<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Mzansi Auto Repairs</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
background:linear-gradient(rgba(11,29,46,.85),rgba(11,29,46,.85)),url('images/workshop.jpg') center/cover}
.card{background:#fff;border-radius:18px;padding:34px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
h1{color:#0b1d2e;font-size:1.5rem;margin-bottom:4px}.sub{color:#6c757d;margin-bottom:20px;font-size:.92rem}
.tabs{display:flex;background:#eef3f8;border-radius:30px;margin-bottom:18px}
.tabs button{flex:1;padding:10px;border:0;background:none;border-radius:30px;font-weight:700;cursor:pointer;color:#1a3a5c}
.tabs button.on{background:#d4a843;color:#0b1d2e}
label.small{display:block;font-size:.8rem;font-weight:700;color:#1a3a5c;margin-bottom:6px}
.role{display:flex;gap:10px;margin-bottom:14px}
.role button{flex:1;padding:10px;border:2px solid #cfd8e3;background:#fff;border-radius:10px;font-weight:700;cursor:pointer;color:#1a3a5c}
.role button.on{border-color:#d4a843;background:#fff7e0}
input{width:100%;padding:12px;margin-bottom:12px;border:1px solid #cfd8e3;border-radius:8px;font-size:.95rem}
.go{width:100%;padding:13px;border:0;border-radius:30px;background:#d4a843;color:#0b1d2e;font-weight:700;font-size:1rem;cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
#msg{margin-top:12px;font-size:.9rem;color:#c0392b;min-height:20px}
.note{font-size:.8rem;color:#6c757d;margin:-4px 0 12px}
.back{display:block;text-align:center;margin-top:14px;color:#1a3a5c;font-size:.9rem}
#nameBox,#regNote{display:none}
</style></head><body>
<div class="card">
<h1><i class="fa-solid fa-screwdriver-wrench" style="color:#d4a843"></i> Mzansi Auto Repairs</h1>
<p class="sub" id="sub">Log in to manage your vehicles, bookings and reviews.</p>
<div class="tabs"><button id="tLogin" class="on" type="button">Login</button><button id="tReg" type="button">Register</button></div>

<div id="roleBox">
  <label class="small">Sign in as</label>
  <div class="role">
    <button id="rCustomer" class="on" type="button"><i class="fa-solid fa-user"></i> Customer</button>
    <button id="rAdmin" type="button"><i class="fa-solid fa-user-shield"></i> Admin</button>
  </div>
</div>

<div id="nameBox"><input id="fullName" placeholder="Full name"></div>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password (min 6 characters)">
<p class="note" id="regNote">Registration creates a customer account. Admin accounts are created by the workshop only.</p>
<button class="go" id="go" type="button">Login</button>
<div id="msg"></div>
<a class="back" href="index.html">&larr; Back to website</a>
</div>
<script src="js/firebase-init.js"></script>
<script>
let mode = 'login', role = 'customer';
const $ = id => document.getElementById(id);

function render() {
  $('tLogin').classList.toggle('on', mode === 'login');
  $('tReg').classList.toggle('on', mode === 'register');
  $('roleBox').style.display = mode === 'login' ? 'block' : 'none';
  $('nameBox').style.display = mode === 'register' ? 'block' : 'none';
  $('regNote').style.display = mode === 'register' ? 'block' : 'none';
  $('go').textContent = mode === 'register' ? 'Create customer account'
    : (role === 'admin' ? 'Login as Admin' : 'Login');
  $('rCustomer').classList.toggle('on', role === 'customer');
  $('rAdmin').classList.toggle('on', role === 'admin');
  $('msg').textContent = '';
}
$('tLogin').onclick = () => { mode = 'login'; render(); };
$('tReg').onclick = () => { mode = 'register'; render(); };
$('rCustomer').onclick = () => { role = 'customer'; render(); };
$('rAdmin').onclick = () => { role = 'admin'; render(); };

$('go').onclick = async () => {
  const email = $('email').value.trim(), pw = $('password').value;
  const btn = $('go');
  $('msg').textContent = '';
  btn.disabled = true;
  try {
    if (mode === 'register') {
      const name = $('fullName').value.trim();
      if (!name) { $('msg').textContent = 'Please enter your name.'; return; }
      const c = await auth.createUserWithEmailAndPassword(email, pw);
      await c.user.updateProfile({ displayName: name });
      // Website registration can only ever create a CUSTOMER (enforced by Firestore rules too).
      await db.collection('users').doc(c.user.uid).set({
        uid: c.user.uid, fullName: name, email,
        role: 'CUSTOMER', status: 'ACTIVE',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      location.href = 'dashboard.html';
      return;
    }

    const cred = await auth.signInWithEmailAndPassword(email, pw);
    if (role === 'admin') {
      const snap = await db.collection('users').doc(cred.user.uid).get();
      const d = snap.exists ? snap.data() : {};
      if (d.role === 'ADMIN' && d.status === 'APPROVED') {
        location.href = 'admin.html';
      } else {
        await auth.signOut();
        $('msg').textContent = 'This account does not have admin access.';
      }
    } else {
      location.href = 'dashboard.html';
    }
  } catch (e) {
    $('msg').textContent = (e.message || 'Something went wrong').replace('Firebase: ', '');
  } finally {
    btn.disabled = false;
  }
};
render();
</script></body></html>
